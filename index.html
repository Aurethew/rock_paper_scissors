<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.cdnfonts.com/css/public-pixel" rel="stylesheet">
    <title>rock_paper_scissors</title>
</head>

<body>
    <h1>Rock Paper Scissors</h1>
    <div class="set">
     <h2>Play !</h2>
        <div class="dice">
            <p>Player 1</p>
            <img class="img1" src="./images/icon4.png">
        </div>

        <div class="dice">
            <p>Player 2</p>
            <img class="img2" src="./images/icon4.png">
        </div>
    </div>
    <div class="btn">
        <button class="rock item">Rock</button>
        <button class="paper item">Paper</button>
        <button class="scissors item">Scissors</button>
    </div>

    <!-- Include Javascript -->
    <script src="index.js"></script>

    <footer>
        <p>Give it a try</p>
    </footer>
